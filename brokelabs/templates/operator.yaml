{{- $name := "operator" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brokelabs-operator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
---
# Rules generated from the operator's +kubebuilder:rbac markers (files/operator-role.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: brokelabs-operator
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
rules:
  {{- (.Files.Get "files/operator-role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brokelabs-operator
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: brokelabs-operator
subjects:
  - kind: ServiceAccount
    name: brokelabs-operator
    namespace: {{ .Release.Namespace }}
---
# Files of challenges installed from registries, stored next to the platform.
# Namespaced, so it is not generated from the operator's markers.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: brokelabs-operator-packages
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: brokelabs-operator-packages
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: brokelabs-operator-packages
subjects:
  - kind: ServiceAccount
    name: brokelabs-operator
    namespace: {{ .Release.Namespace }}
---
{{- if eq .Values.profile "cluster" }}
# Leader election (several replicas).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: brokelabs-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: brokelabs-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: brokelabs-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: brokelabs-operator
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokelabs-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "brokelabs.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ include "brokelabs.replicas" . }}
  selector:
    matchLabels: {{- include "brokelabs.selector" (dict "root" . "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "brokelabs.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      serviceAccountName: brokelabs-operator
      securityContext: {{- include "brokelabs.podSecurityContext" . | nindent 8 }}
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: operator
          image: {{ include "brokelabs.image" (dict "root" . "name" $name) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --checker-image={{ .Values.operator.checkerImage | default (include "brokelabs.image" (dict "root" . "name" "checker")) }}
            - --gateway-service-account={{ .Release.Namespace }}/brokelabs-gateway
            # Pods let into instances with vm machines over SSH: the operator
            # (setup) and the gateway (terminals).
            - --operator-pod-labels=app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/name={{ $name }}
            - --gateway-pod-labels=app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/name=gateway
            {{- with .Values.operator.plainHTTPRegistries }}
            - --plain-http-registries={{ join "," . }}
            {{- end }}
            {{- if .Values.mirror.enabled }}
            # Push access to the registry mirror (PlatformConfig.registryMirror),
            # read at every copy so that new credentials need no restart.
            - --mirror-credentials=/etc/brokelabs/mirror
            {{- end }}
            {{- if .Values.operator.sigstoreTrustedRoot.configMap }}
            - --sigstore-trusted-root=/etc/brokelabs/sigstore/trusted_root.json
            {{- end }}
            {{- if eq .Values.profile "cluster" }}
            - --leader-elect
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}

          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          securityContext: {{- include "brokelabs.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.mirror.enabled }}
            - {name: mirror-credentials, mountPath: /etc/brokelabs/mirror, readOnly: true}
            {{- end }}
            {{- if .Values.operator.sigstoreTrustedRoot.configMap }}
            - {name: sigstore-trusted-root, mountPath: /etc/brokelabs/sigstore, readOnly: true}
            {{- end }}
      volumes:
        {{- if .Values.mirror.enabled }}
        - name: mirror-credentials
          secret:
            secretName: {{ include "brokelabs.mirrorSecret" . }}
            items: [{key: username, path: username}, {key: password, path: password}]
        {{- end }}
        {{- with .Values.operator.sigstoreTrustedRoot.configMap }}
        - name: sigstore-trusted-root
          configMap:
            name: {{ . }}
            items: [{key: {{ $.Values.operator.sigstoreTrustedRoot.key }}, path: trusted_root.json}]
        {{- end }}
