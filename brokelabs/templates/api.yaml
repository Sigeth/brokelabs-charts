{{- $name := "api" -}}
{{- $secret := .Values.api.signingKeySecret | default "brokelabs-api-signing-key" -}}
{{- if not .Values.api.signingKeySecret }}
{{- /* Keep the generated key across upgrades: tokens and the gateway's keys stay valid. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  key.pem: {{ index $existing.data "key.pem" }}
  {{- else }}
  key.pem: {{ genPrivateKey "ed25519" | b64enc }}
  {{- end }}
---
{{- end }}
{{- if not .Values.admin.passwordSecret }}
{{- /* Installs before chart 0.7 named this Secret brokelabs-solo: keep its password. */}}
{{- $admin := lookup "v1" "Secret" .Release.Namespace "brokelabs-admin" | default (lookup "v1" "Secret" .Release.Namespace "brokelabs-solo") }}
apiVersion: v1
kind: Secret
metadata:
  name: brokelabs-admin
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $admin }}
  password: {{ index $admin.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 20 | b64enc }}
  {{- end }}
---
{{- end }}
{{- if and (not .Values.postgres.enabled) (not .Values.api.databaseSecret) }}
{{- fail "api.databaseSecret is required when postgres.enabled is false" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokelabs-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "brokelabs.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ include "brokelabs.replicas" . }}
  selector:
    matchLabels: {{- include "brokelabs.selector" (dict "root" . "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "brokelabs.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      serviceAccountName: brokelabs-api
      securityContext: {{- include "brokelabs.podSecurityContext" . | nindent 8 }}
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        # The web image only carries the built UI: copy it next to the api.
        - name: web
          image: {{ include "brokelabs.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [cp, -r, /dist/., /web/]
          volumeMounts:
            - {name: web, mountPath: /web}
          securityContext: {{- include "brokelabs.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "brokelabs.image" (dict "root" . "name" $name) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: BROKELABS_LISTEN, value: "0.0.0.0:8080"}
            - {name: BROKELABS_WEB_DIR, value: /web}
            - {name: BROKELABS_SIGNING_KEY_FILE, value: /etc/brokelabs/signing-key/key.pem}
            - {name: BROKELABS_LOG_FORMAT, value: json}
            - {name: BROKELABS_DATABASE_URL_FILE, value: /etc/brokelabs/database/url}
            - {name: BROKELABS_INSTANCES_NAMESPACE, value: {{ .Values.instancesNamespace.name }}}
            - {name: BROKELABS_SYSTEM_NAMESPACE, value: {{ .Release.Namespace }}}
            - {name: BROKELABS_GATEWAY_URL, value: {{ include "brokelabs.gatewayURL" . | quote }}}
            - {name: BROKELABS_ALLOWED_ORIGINS, value: {{ include "brokelabs.allowedOrigins" . | quote }}}
            - {name: BROKELABS_COOKIE_SECURE, value: {{ .Values.api.cookieSecure | quote }}}
            - {name: BROKELABS_MODE, value: {{ .Values.mode | quote }}}
            - {name: BROKELABS_PUBLIC_URL, value: {{ include "brokelabs.publicURL" . | quote }}}
            {{- with .Values.oidc }}
            {{- if .enabled }}
            - {name: BROKELABS_OIDC_ISSUER, value: {{ required "oidc.issuer is required when oidc.enabled" .issuer | quote }}}
            - {name: BROKELABS_OIDC_CLIENT_ID, value: {{ required "oidc.clientID is required when oidc.enabled" .clientID | quote }}}
            - {name: BROKELABS_OIDC_LABEL, value: {{ .label | quote }}}
            - {name: BROKELABS_OIDC_SCOPES, value: {{ .scopes | quote }}}
            - {name: BROKELABS_OIDC_GROUPS_CLAIM, value: {{ .groupsClaim | quote }}}
            - {name: BROKELABS_OIDC_ADMIN_GROUPS, value: {{ join "," .adminGroups | quote }}}
            - {name: BROKELABS_OIDC_TEACHER_GROUPS, value: {{ join "," .teacherGroups | quote }}}
            {{- if .clientSecretName }}
            - {name: BROKELABS_OIDC_CLIENT_SECRET_FILE, value: /etc/brokelabs/oidc/clientSecret}
            {{- end }}
            {{- if .backchannelURL }}
            - {name: BROKELABS_OIDC_BACKCHANNEL_URL, value: {{ .backchannelURL | quote }}}
            {{- end }}
            {{- if .caConfigMap }}
            - {name: BROKELABS_OIDC_CA_FILE, value: /etc/brokelabs/oidc-ca/ca.crt}
            {{- end }}
            {{- end }}
            {{- end }}
            - {name: BROKELABS_ADMIN_USERNAME, value: {{ .Values.admin.username | quote }}}
            - {name: BROKELABS_ADMIN_PASSWORD_FILE, value: /etc/brokelabs/admin/password}
          ports:
            - {name: http, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: web, mountPath: /web, readOnly: true}
            - {name: signing-key, mountPath: /etc/brokelabs/signing-key, readOnly: true}
            - {name: database, mountPath: /etc/brokelabs/database, readOnly: true}
            - {name: admin, mountPath: /etc/brokelabs/admin, readOnly: true}
            {{- if and .Values.oidc.enabled .Values.oidc.clientSecretName }}
            - {name: oidc, mountPath: /etc/brokelabs/oidc, readOnly: true}
            {{- end }}
            {{- if and .Values.oidc.enabled .Values.oidc.caConfigMap }}
            - {name: oidc-ca, mountPath: /etc/brokelabs/oidc-ca, readOnly: true}
            {{- end }}
          securityContext: {{- include "brokelabs.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: web
          emptyDir: {}
        - name: signing-key
          secret:
            secretName: {{ $secret }}
        - name: database
          secret:
            secretName: {{ .Values.api.databaseSecret | default .Values.postgres.existingSecret | default "brokelabs-postgres" }}
            items: [{key: url, path: url}]
        - name: admin
          secret:
            secretName: {{ .Values.admin.passwordSecret | default "brokelabs-admin" }}
            items: [{key: password, path: password}]
        {{- if and .Values.oidc.enabled .Values.oidc.clientSecretName }}
        - name: oidc
          secret:
            secretName: {{ .Values.oidc.clientSecretName }}
            items: [{key: clientSecret, path: clientSecret}]
        {{- end }}
        {{- if and .Values.oidc.enabled .Values.oidc.caConfigMap }}
        - name: oidc-ca
          configMap:
            name: {{ .Values.oidc.caConfigMap }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: brokelabs-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
spec:
  selector: {{- include "brokelabs.selector" (dict "root" . "name" $name) | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http}
