{{- if .Values.mirror.enabled }}
{{- /*
In-cluster registry mirror (Zot, D39). The operator copies installed packages,
their signatures and every image they use into it; each node's containerd is
configured to pull through it ("brokelabs mirror node-config"). Reads are
anonymous (pulls are pinned by digest, so the mirror cannot serve other
content); only the operator may push.
*/}}
{{- $name := "mirror" -}}
{{- $secret := include "brokelabs.mirrorSecret" . }}
{{- $htpasswd := "" }}
{{- if not .Values.mirror.existingSecret }}
{{- /* Keep the generated credentials across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- $htpasswd = index $existing.data "htpasswd" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- $htpasswd = htpasswd "brokelabs-operator" $password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: brokelabs-mirror-credentials
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The operator pushes with these; Zot reads the htpasswd entry.
  username: brokelabs-operator
  password: {{ $password | quote }}
  htpasswd: {{ $htpasswd | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: brokelabs-mirror
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {"rootDirectory": "/var/lib/registry", "gc": true},
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": {"htpasswd": {"path": "/etc/zot/auth/htpasswd"}},
        "accessControl": {
          "repositories": {
            "**": {
              "anonymousPolicy": ["read"],
              "policies": [{"users": ["brokelabs-operator"], "actions": ["read", "create", "update", "delete"]}]
            }
          }
        }
      },
      "log": {"level": "info"}
    }
---
apiVersion: v1
kind: Service
metadata:
  name: brokelabs-mirror
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
spec:
  {{- with .Values.mirror.service.clusterIP }}
  # Fixed, so the containerd configuration of the nodes can name it.
  clusterIP: {{ . }}
  {{- end }}
  selector: {{- include "brokelabs.selector" (dict "root" . "name" $name) | nindent 4 }}
  ports:
    - {name: registry, port: 5000, targetPort: registry}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brokelabs-mirror
  namespace: {{ .Release.Namespace }}
  labels: {{- include "brokelabs.labels" . | nindent 4 }}
  annotations:
    # Mirrored images survive a chart uninstall.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.mirror.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mirror.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brokelabs-mirror
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "brokelabs.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  strategy: {type: Recreate} # one writer of the volume
  selector:
    matchLabels: {{- include "brokelabs.selector" (dict "root" . "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "brokelabs.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/config: {{ .Values.mirror | toJson | sha256sum }}
        # Zot reads its htpasswd file at startup.
        checksum/credentials: {{ $htpasswd | sha256sum }}
    spec:
      securityContext:
        {{- include "brokelabs.podSecurityContext" . | nindent 8 }}
        fsGroup: 65532
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: zot
          image: {{ .Values.mirror.image }}
          imagePullPolicy: IfNotPresent
          args: [serve, /etc/zot/config.json]
          ports:
            - {name: registry, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /v2/, port: registry}
          livenessProbe:
            httpGet: {path: /v2/, port: registry}
            initialDelaySeconds: 10
          securityContext: {{- include "brokelabs.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.mirror.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/zot/config.json, subPath: config.json, readOnly: true}
            - {name: auth, mountPath: /etc/zot/auth, readOnly: true}
            - {name: data, mountPath: /var/lib/registry}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: brokelabs-mirror}
        - name: auth
          secret:
            secretName: {{ $secret }}
            items: [{key: htpasswd, path: htpasswd}]
        - name: data
          persistentVolumeClaim: {claimName: brokelabs-mirror}
        - name: tmp
          emptyDir: {}
{{- end }}
