# single: one Linux machine (one replica of everything).
# cluster: several nodes (two replicas of the stateless services, leader election).
profile: single

image:
  registry: ghcr.io/sigeth
  # Overrides the tag of every component image (e.g. "dev"). Empty: each
  # component uses its released version below.
  tag: ""
  pullPolicy: IfNotPresent

# Released version of each component image (<registry>/brokelabs-<component>).
# Components are versioned on their own: bump one when it is released.
versions:
  operator: v0.7.0
  checker: v0.6.0
  api: v0.5.0
  web: v0.5.0
  gateway: v0.5.0

# Namespace holding ChallengeInstances, CheckRuns and instance resources.
instancesNamespace:
  name: brokelabs-instances
  create: true

# Cluster-wide policy (the PlatformConfig named "default").
# Policy checked against the permissions every challenge needs (D41): a
# challenge asking for more is installed but not runnable, until the policy
# allows it.
platform:
  allowedRuntimes: []
  allowedEgress: none
  maxInstanceLifetime: 4h
  # CPU and memory the machines of one instance may request, e.g. {cpu: "4", memory: 8Gi}.
  maxInstanceResources: {}
  # Kinds ("Kind" or "Kind.group") extraManifests may create. Empty allows the
  # defaults (workloads and their configuration, no RBAC or NetworkPolicy);
  # ["*"] allows every namespaced kind.
  allowedExtraManifestKinds: []

# Catalogs challenges are installed from (D40). The official catalog is
# verified like any other source: only its release workflow is trusted, through
# Sigstore keyless signatures. Disable it for air-gapped or school-only installs.
catalogs:
  official:
    enabled: true
    ref: ghcr.io/sigeth/brokelabs-catalog:latest
    syncInterval: 1h
    trust:
      keyless:
        - issuer: https://token.actions.githubusercontent.com
          subjectRegExp: '^https://github\.com/Sigeth/brokelabs-challenges/\.github/workflows/release\.yaml@refs/tags/.+$'

operator:
  # Built-in checker image. Defaults to <image.registry>/brokelabs-checker:<versions.checker>.
  checkerImage: ""
  # Registries the operator reaches over plain HTTP (host:port), for local
  # test registries only. Packages always come over HTTPS otherwise.
  plainHTTPRegistries: []
  # Sigstore trusted root verifying keyless signatures (the official catalog).
  # By default the operator fetches it from the Sigstore public-good TUF
  # repository when first needed. Air-gapped installs put a trusted_root.json
  # in a ConfigMap of the release namespace and name it here.
  sigstoreTrustedRoot:
    configMap: ""
    key: trusted_root.json
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

api:
  # Existing Secret with a PKCS#8 PEM Ed25519 key under "key.pem". When empty,
  # the chart generates one and keeps it across upgrades.
  signingKeySecret: ""
  # Existing Secret with the PostgreSQL URL under "url". Required when
  # postgres.enabled is false.
  databaseSecret: ""
  # Origins allowed to send state-changing requests (CSRF protection), e.g.
  # https://brokelabs.example.org. Defaults to https://<httpRoute.hostname>.
  allowedOrigins: []
  # Session cookies over HTTPS only (browsers accept them on http://localhost).
  cookieSecure: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  service:
    port: 8080

gateway:
  # Public URL of the gateway, as browsers reach it. Defaults to
  # https://<httpRoute.gatewayHostname>.
  publicURL: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  service:
    port: 8081

# Gateway API routes (requires a Gateway, e.g. Traefik on k3s).
httpRoute:
  enabled: false
  parentRefs: []
  # Platform UI and api, e.g. brokelabs.example.org
  hostname: ""
  # Gateway (terminals), e.g. gw.brokelabs.example.org
  gatewayHostname: ""

# How the platform is used (D12):
# solo: one person running BrokeLabs for themselves (no users or classrooms).
# organization: a school or team, with accounts, roles and classrooms.
mode: solo

# First admin account, created when there is no user yet (in solo mode, the
# only account). The password is generated at install time and kept across
# upgrades (Secret brokelabs-admin, key "password"), unless passwordSecret
# names an existing Secret with a "password" key.
admin:
  username: admin
  passwordSecret: ""

# Single PostgreSQL pod. Disable it to use an external database
# (api.databaseSecret).
# In-cluster registry mirror (Zot, D39): installed challenges and their images
# are copied into it, so instances start without the internet once installed.
# Nodes pull through it after "brokelabs mirror node-config".
mirror:
  enabled: true
  # Existing Secret with the push credentials ("username", "password" and
  # their "htpasswd" bcrypt entry) instead of generated ones.
  existingSecret: ""
  image: ghcr.io/project-zot/zot-linux-amd64:v2.1.8
  storage:
    size: 20Gi
    storageClass: ""
  service:
    # Fixed ClusterIP (inside the service CIDR), so the containerd
    # configuration of the nodes can name it. Empty: assigned by Kubernetes.
    clusterIP: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 1Gi}

postgres:
  enabled: true
  # Existing Secret with "password" and "url" (the api's connection URL)
  # instead of a generated one.
  existingSecret: ""
  image: docker.io/library/postgres:18
  storage: 2Gi
  storageClass: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
